<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1200" viewBox="0 0 1920 1200" font-family="monospace">
  <!-- mockup tablet 1 (dashboard) — tokens sis -->
  <rect width="1920" height="1200" fill="#080a0c"/>

  <!-- sidebar -->
  <rect x="0" y="0" width="340" height="1200" fill="#0b0e10"/>
  <line x1="340" y1="0" x2="340" y2="1200" stroke="#1e2a2a" stroke-width="2"/>
  <g transform="translate(40,48)">
    <rect x="0" y="0" width="56" height="56" rx="12" fill="#0f1214" stroke="#1e2a2a" stroke-width="2"/>
    <text x="28" y="37" font-size="22" font-weight="700" letter-spacing="1" fill="#1db954" text-anchor="middle">SIS</text>
    <text x="74" y="26" font-size="30" font-weight="700" fill="#e0e8e8">sis</text>
    <text x="74" y="50" font-size="16" fill="#6a7a7a">listening stats</text>
  </g>
  <g transform="translate(40,168)" font-size="22">
    <text x="0" y="0" font-size="15" fill="#5a6a6a" letter-spacing="2">LISTEN</text>
    <rect x="-12" y="22" width="264" height="48" rx="4" fill="#13241a"/>
    <text x="8" y="54" fill="#1db954">~  Dashboard</text>
    <text x="8" y="116" fill="#9aa8a8">#  History</text>
    <text x="0" y="186" font-size="15" fill="#5a6a6a" letter-spacing="2">STATS</text>
    <text x="8" y="240" fill="#9aa8a8">*  Rankings</text>
    <text x="8" y="302" fill="#9aa8a8">%  Charts</text>
    <text x="0" y="372" font-size="15" fill="#5a6a6a" letter-spacing="2">HIGHLIGHTS</text>
    <text x="8" y="426" fill="#9aa8a8">!  Insights</text>
    <text x="8" y="488" fill="#9aa8a8">^  Records</text>
    <text x="0" y="558" font-size="15" fill="#5a6a6a" letter-spacing="2">LIBRARY</text>
    <text x="8" y="612" fill="#9aa8a8">+  Playlists</text>
    <text x="8" y="674" fill="#9aa8a8">@  Users</text>
  </g>
  <g transform="translate(40,1140)">
    <circle cx="10" cy="-8" r="8" fill="#1db954"/>
    <text x="30" y="-2" font-size="16" fill="#6a7a7a">syncing · live</text>
  </g>

  <!-- content -->
  <g transform="translate(400,56)">
    <!-- caption -->
    <text x="0" y="36" font-size="40" font-weight="700" fill="#e0e8e8">your music, logged in real time —</text>
    <text x="0" y="86" font-size="40" font-weight="700" fill="#1db954">your own server, your data</text>

    <!-- now playing + weekly stats -->
    <g transform="translate(0,132)">
      <rect width="912" height="248" rx="4" fill="#0f1214" stroke="#1e2a2a" stroke-width="2"/>
      <rect x="28" y="28" width="192" height="192" rx="4" fill="#6e3a55"/>
      <g fill="#1ed760">
        <rect x="70" y="158" width="12" height="42" rx="2"/>
        <rect x="94" y="134" width="12" height="66" rx="2"/>
        <rect x="118" y="170" width="12" height="30" rx="2"/>
        <rect x="142" y="120" width="12" height="80" rx="2"/>
      </g>
      <text x="256" y="76" font-size="22" fill="#1db954">now playing</text>
      <text x="256" y="130" font-size="44" font-weight="700" fill="#e0e8e8">Neon Tide</text>
      <text x="256" y="172" font-size="28" fill="#9aa8a8">Violet Lake</text>
      <text x="256" y="210" font-size="22" fill="#6a7a7a">Slow Horizons · 2024</text>
    </g>
    <g transform="translate(944,132)">
      <rect width="512" height="248" rx="4" fill="#0f1214" stroke="#1e2a2a" stroke-width="2"/>
      <text x="36" y="58" font-size="24" font-weight="700" fill="#e0e8e8">This week</text>
      <g transform="translate(36,96)">
        <text x="0" y="40" font-size="44" font-weight="700" fill="#e0e8e8">11h</text>
        <text x="0" y="74" font-size="18" fill="#6a7a7a">listened</text>
        <text x="190" y="40" font-size="44" font-weight="700" fill="#e0e8e8">214</text>
        <text x="190" y="74" font-size="18" fill="#6a7a7a">plays</text>
        <text x="350" y="40" font-size="44" font-weight="700" fill="#1db954">9d</text>
        <text x="350" y="74" font-size="18" fill="#6a7a7a">streak</text>
      </g>
    </g>

    <!-- three columns: top tracks / albums / artists -->
    <g transform="translate(0,420)">
      <!-- top tracks -->
      <text x="0" y="30" font-size="26" font-weight="700" fill="#e0e8e8">Top tracks this week</text>
      <g transform="translate(0,52)" font-size="22">
        <g><rect width="450" height="92" rx="4" fill="#0f1214" stroke="#1e2a2a" stroke-width="2"/>
          <text x="30" y="58" font-weight="700" fill="#f0c040">1</text>
          <rect x="54" y="20" width="52" height="52" rx="4" fill="#2a4d6e"/>
          <text x="124" y="46" font-weight="700" fill="#e0e8e8">Paper Cities</text>
          <text x="124" y="72" font-size="17" fill="#6a7a7a">The North Wing</text>
          <text x="420" y="58" font-weight="700" fill="#e0e8e8" text-anchor="end">52</text></g>
        <g transform="translate(0,104)"><rect width="450" height="92" rx="4" fill="#0f1214" stroke="#1e2a2a" stroke-width="2"/>
          <text x="30" y="58" font-weight="700" fill="#c8c8c8">2</text>
          <rect x="54" y="20" width="52" height="52" rx="4" fill="#6e3a55"/>
          <text x="124" y="46" font-weight="700" fill="#e0e8e8">Neon Tide</text>
          <text x="124" y="72" font-size="17" fill="#6a7a7a">Violet Lake</text>
          <text x="420" y="58" font-weight="700" fill="#e0e8e8" text-anchor="end">44</text></g>
        <g transform="translate(0,208)"><rect width="450" height="92" rx="4" fill="#0f1214" stroke="#1e2a2a" stroke-width="2"/>
          <text x="30" y="58" font-weight="700" fill="#b07a3a">3</text>
          <rect x="54" y="20" width="52" height="52" rx="4" fill="#3a6e4a"/>
          <text x="124" y="46" font-weight="700" fill="#e0e8e8">Glass Harbor</text>
          <text x="124" y="72" font-size="17" fill="#6a7a7a">Marina Foss</text>
          <text x="420" y="58" font-weight="700" fill="#e0e8e8" text-anchor="end">39</text></g>
        <g transform="translate(0,312)"><rect width="450" height="92" rx="4" fill="#0f1214" stroke="#1e2a2a" stroke-width="2"/>
          <text x="30" y="58" font-weight="700" fill="#6a7a7a">4</text>
          <rect x="54" y="20" width="52" height="52" rx="4" fill="#6e5a2a"/>
          <text x="124" y="46" font-weight="700" fill="#e0e8e8">Saltwater Run</text>
          <text x="124" y="72" font-size="17" fill="#6a7a7a">Empty Pools</text>
          <text x="420" y="58" font-weight="700" fill="#e0e8e8" text-anchor="end">31</text></g>
      </g>

      <!-- top albums -->
      <g transform="translate(506,0)">
        <text x="0" y="30" font-size="26" font-weight="700" fill="#e0e8e8">Top albums</text>
        <g transform="translate(0,52)">
          <g><rect width="200" height="200" rx="4" fill="#2a4d6e"/><text x="14" y="36" font-size="22" font-weight="700" fill="#fff">1</text></g>
          <g transform="translate(224,0)"><rect width="200" height="200" rx="4" fill="#6e3a55"/><text x="14" y="36" font-size="22" font-weight="700" fill="#fff">2</text></g>
          <text x="0" y="232" font-size="20" font-weight="700" fill="#e0e8e8">Foldout</text>
          <text x="0" y="256" font-size="16" fill="#6a7a7a">The North Wing · 128</text>
          <text x="224" y="232" font-size="20" font-weight="700" fill="#e0e8e8">Slow Horizons</text>
          <text x="224" y="256" font-size="16" fill="#6a7a7a">Violet Lake · 96</text>
        </g>
      </g>

      <!-- top artists -->
      <g transform="translate(962,0)">
        <text x="0" y="30" font-size="26" font-weight="700" fill="#e0e8e8">Top artists</text>
        <g transform="translate(0,52)">
          <circle cx="100" cy="100" r="100" fill="#3a6e4a"/><text x="100" y="112" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">1</text>
          <circle cx="324" cy="100" r="100" fill="#5a2e6e"/><text x="324" y="112" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">2</text>
          <text x="100" y="232" font-size="20" font-weight="700" fill="#e0e8e8" text-anchor="middle">The North Wing</text>
          <text x="100" y="256" font-size="16" fill="#6a7a7a" text-anchor="middle">214 plays</text>
          <text x="324" y="232" font-size="20" font-weight="700" fill="#e0e8e8" text-anchor="middle">Violet Lake</text>
          <text x="324" y="256" font-size="16" fill="#6a7a7a" text-anchor="middle">187 plays</text>
        </g>
      </g>
    </g>

    <!-- recent plays strip -->
    <g transform="translate(0,872)">
      <text x="0" y="30" font-size="26" font-weight="700" fill="#e0e8e8">Recent plays</text>
      <g transform="translate(0,52)" font-size="20">
        <g><rect width="350" height="88" rx="4" fill="#0f1214" stroke="#1e2a2a" stroke-width="2"/>
          <rect x="18" y="16" width="56" height="56" rx="4" fill="#6e3a55"/>
          <text x="92" y="44" font-weight="700" fill="#e0e8e8">Neon Tide</text>
          <text x="92" y="68" font-size="16" fill="#6a7a7a">Violet Lake</text>
          <text x="332" y="52" font-size="16" fill="#6a7a7a" text-anchor="end">now</text></g>
        <g transform="translate(368,0)"><rect width="350" height="88" rx="4" fill="#0f1214" stroke="#1e2a2a" stroke-width="2"/>
          <rect x="18" y="16" width="56" height="56" rx="4" fill="#2a4d6e"/>
          <text x="92" y="44" font-weight="700" fill="#e0e8e8">Paper Cities</text>
          <text x="92" y="68" font-size="16" fill="#6a7a7a">The North Wing</text>
          <text x="332" y="52" font-size="16" fill="#6a7a7a" text-anchor="end">4m</text></g>
        <g transform="translate(736,0)"><rect width="350" height="88" rx="4" fill="#0f1214" stroke="#1e2a2a" stroke-width="2"/>
          <rect x="18" y="16" width="56" height="56" rx="4" fill="#3a6e4a"/>
          <text x="92" y="44" font-weight="700" fill="#e0e8e8">Glass Harbor</text>
          <text x="92" y="68" font-size="16" fill="#6a7a7a">Marina Foss</text>
          <text x="332" y="52" font-size="16" fill="#6a7a7a" text-anchor="end">8m</text></g>
        <g transform="translate(1104,0)"><rect width="350" height="88" rx="4" fill="#0f1214" stroke="#1e2a2a" stroke-width="2"/>
          <rect x="18" y="16" width="56" height="56" rx="4" fill="#6e5a2a"/>
          <text x="92" y="44" font-weight="700" fill="#e0e8e8">Saltwater Run</text>
          <text x="92" y="68" font-size="16" fill="#6a7a7a">Empty Pools</text>
          <text x="332" y="52" font-size="16" fill="#6a7a7a" text-anchor="end">12m</text></g>
      </g>
    </g>
  </g>
</svg>
