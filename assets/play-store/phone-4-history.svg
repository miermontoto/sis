<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" font-family="monospace">
  <!-- mockup phone 4 (history) — tokens sis -->
  <rect width="1080" height="1920" fill="#080a0c"/>

  <!-- caption marketing (localizable) -->
  <text x="64" y="120" font-size="46" font-weight="700" fill="#e0e8e8">cada reproducción,</text>
  <text x="64" y="178" font-size="46" font-weight="700" fill="#1db954">agrupada por sesión</text>

  <!-- app bar -->
