        <g transform="translate(0,216)"><text x="0" y="46" font-size="28" font-weight="700" fill="#6a7a7a">4</text><rect x="36" y="18" width="50" height="50" rx="4" fill="#6e5a2a"/><text x="104" y="38" font-weight="700" fill="#e0e8e8">Saltwater Run</text><text x="104" y="62" font-size="17" fill="#6a7a7a">Empty Pools</text><rect x="520" y="22" width="546" height="42" rx="2" fill="#147f3b"/><text x="1404" y="52" font-weight="700" fill="#e0e8e8" text-anchor="end">398</text></g>
        <g transform="translate(0,288)"><text x="0" y="46" font-size="28" font-weight="700" fill="#6a7a7a">5</text><rect x="36" y="18" width="50" height="50" rx="4" fill="#3a4d6e"/><text x="104" y="38" font-weight="700" fill="#e0e8e8">Low Ceiling</text><text x="104" y="62" font-size="17" fill="#6a7a7a">Hours Apart</text><rect x="520" y="22" width="482" height="42" rx="2" fill="#11682f"/><text x="1404" y="52" font-weight="700" fill="#e0e8e8" text-anchor="end">351</text></g>
        <g transform="translate(0,360)"><text x="0" y="46" font-size="28" font-weight="700" fill="#6a7a7a">6</text><rect x="36" y="18" width="50" height="50" rx="4" fill="#5a2e6e"/><text x="104" y="38" font-weight="700" fill="#e0e8e8">Cold Signal</text><text x="104" y="62" font-size="17" fill="#6a7a7a">Aria Bloom</text><rect x="520" y="22" width="396" height="42" rx="2" fill="#10592a"/><text x="1404" y="52" font-weight="700" fill="#e0e8e8" text-anchor="end">288</text></g>
        <g transform="translate(0,432)"><text x="0" y="46" font-size="28" font-weight="700" fill="#6a7a7a">7</text><rect x="36" y="18" width="50" height="50" rx="4" fill="#2e6e6a"/><text x="104" y="38" font-weight="700" fill="#e0e8e8">Half Light</text><text x="104" y="62" font-size="17" fill="#6a7a7a">The North Wing</text><rect x="520" y="22" width="330" height="42" rx="2" fill="#0e4a24"/><text x="1404" y="52" font-weight="700" fill="#e0e8e8" text-anchor="end">241</text></g>
        <g transform="translate(0,504)"><text x="0" y="46" font-size="28" font-weight="700" fill="#6a7a7a">8</text><rect x="36" y="18" width="50" height="50" rx="4" fill="#6e4a2e"/><text x="104" y="38" font-weight="700" fill="#e0e8e8">Pale Static</text><text x="104" y="62" font-size="17" fill="#6a7a7a">Marina Foss</text><rect x="520" y="22" width="282" height="42" rx="2" fill="#0e4a24"/><text x="1404" y="52" font-weight="700" fill="#e0e8e8" text-anchor="end">205</text></g>
        <g transform="translate(0,576)"><text x="0" y="46" font-size="28" font-weight="700" fill="#6a7a7a">9</text><rect x="36" y="18" width="50" height="50" rx="4" fill="#3a4d6e"/><text x="104" y="38" font-weight="700" fill="#e0e8e8">First Frost</text><text x="104" y="62" font-size="17" fill="#6a7a7a">Violet Lake</text><rect x="520" y="22" width="244" height="42" rx="2" fill="#0c3d1e"/><text x="1404" y="52" font-weight="700" fill="#e0e8e8" text-anchor="end">177</text></g>
        <g transform="translate(0,648)"><text x="-6" y="46" font-size="28" font-weight="700" fill="#6a7a7a">10</text><rect x="36" y="18" width="50" height="50" rx="4" fill="#4d3a6e"/><text x="104" y="38" font-weight="700" fill="#e0e8e8">Open Water</text><text x="104" y="62" font-size="17" fill="#6a7a7a">Empty Pools</text><rect x="520" y="22" width="208" height="42" rx="2" fill="#0c3d1e"/><text x="1404" y="52" font-weight="700" fill="#e0e8e8" text-anchor="end">152</text></g>
