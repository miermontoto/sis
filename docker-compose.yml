services:
  sis:
    build: .
    ports:
      - "3004:3000"
    volumes:
      - sis-data:/app/data
      # el service-account JSON de firebase (push FCM) se monta desde
      # docker-compose.override.yml (gitignored): es un secreto de cada instancia,
      # y un bind-mount a un fichero que no existe rompe el arranque
    env_file: .env
    environment:
      - DATABASE_PATH=/app/data/sis.db
      # push notifications (opcionales): se leen de .env; si faltan, el sender
      # hace no-op y loguea, nunca lanza. FIREBASE_* habilita android/FCM,
      # VAPID_* habilita web push.
      - FIREBASE_SERVICE_ACCOUNT=${FIREBASE_SERVICE_ACCOUNT:-}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-}
    restart: unless-stopped

volumes:
  sis-data:
