services:
  sis:
    build: .
    ports:
      - "3004:3000"
    volumes:
      - sis-data:/app/data
      # service-account JSON de firebase para push FCM (opcional): descomentar,
      # ajustar la ruta del host y apuntar FIREBASE_SERVICE_ACCOUNT a la ruta
      # del contenedor (p.ej. /app/secrets/firebase-service-account.json)
      # - ./secrets/firebase-service-account.json:/app/secrets/firebase-service-account.json:ro
    env_file: .env
    environment:
      - DATABASE_PATH=/app/data/sis.db
      # push notifications (opcionales): se leen de .env; si faltan, el sender
      # hace no-op y loguea, nunca lanza. FIREBASE_* habilita android/FCM,
      # VAPID_* habilita web push.
      - FIREBASE_SERVICE_ACCOUNT=${FIREBASE_SERVICE_ACCOUNT:-}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-}
    restart: unless-stopped

volumes:
  sis-data:
